<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>씨앗 추천 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .input-group {
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: 0.3s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #764ba2;
            transform: scale(1.2);
        }

        .value-display {
            min-width: 50px;
            text-align: center;
            font-size: 1.3em;
            font-weight: 700;
            color: #667eea;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 40px;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .seed-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 5px solid #667eea;
            transition: 0.3s;
        }

        .seed-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .seed-rank {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            font-weight: 700;
            margin-right: 10px;
        }

        .seed-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .seed-score {
            color: #667eea;
            font-weight: 600;
            font-size: 1.1em;
        }

        .seed-details {
            margin-top: 10px;
            font-size: 0.95em;
            color: #666;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .seed-detail {
            background: white;
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 씨앗 추천 시스템</h1>
        <p class="subtitle">원하는 조건을 입력하면 가장 적합한 씨앗을 추천해드립니다</p>

        <div class="input-group">
            <label>🍎 맛 (0 ~ 10)</label>
            <div class="slider-container">
                <input type="range" id="taste" min="0" max="10" value="5" step="0.1">
                <span class="value-display" id="taste-value">5.0</span>
            </div>
        </div>

        <div class="input-group">
            <label>💪 영양가 (0 ~ 10)</label>
            <div class="slider-container">
                <input type="range" id="nutrition" min="0" max="10" value="5" step="0.1">
                <span class="value-display" id="nutrition-value">5.0</span>
            </div>
        </div>

        <div class="input-group">
            <label>🌾 재배 난이도 (0 ~ 10)</label>
            <div class="slider-container">
                <input type="range" id="difficulty" min="0" max="10" value="5" step="0.1">
                <span class="value-display" id="difficulty-value">5.0</span>
            </div>
        </div>

        <div class="input-group">
            <label>❤️ 선호도 (0 ~ 10)</label>
            <div class="slider-container">
                <input type="range" id="preference" min="0" max="10" value="5" step="0.1">
                <span class="value-display" id="preference-value">5.0</span>
            </div>
        </div>

        <button onclick="getRecommendations()">추천받기</button>

        <div class="results" id="results">
            <h2>🎯 추천 결과</h2>
            <div id="recommendations"></div>
        </div>
    </div>

    <script>
        // 씨앗 데이터셋 생성 (100개)
        // 평균 5, 표준편차 2의 정규분포를 시뮬레이션하여 현실적인 데이터 생성
        function generateNormalRandom(mean, stdDev) {
            let u1 = Math.random();
            let u2 = Math.random();
            let z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
            let value = mean + z0 * stdDev;
            return Math.max(0, Math.min(10, value)); // 0~10 범위로 제한
        }

        const seedNames = [
            '토마토', '오이', '상추', '배추', '무', '당근', '고추', '호박', '가지', '파',
            '마늘', '양파', '감자', '고구마', '옥수수', '콩', '팥', '녹두', '완두', '강낭콩',
            '딸기', '수박', '참외', '멜론', '블루베리', '라즈베리', '포도', '사과', '배', '복숭아',
            '자두', '살구', '체리', '감', '귤', '레몬', '라임', '오렌지', '자몽', '망고',
            '바나나', '파인애플', '키위', '용과', '석류', '무화과', '대추', '밤', '호두', '잣',
            '아몬드', '피칸', '캐슈넛', '마카다미아', '해바라기', '들깨', '참깨', '아마씨', '치아씨', '퀴노아',
            '브로콜리', '콜리플라워', '양배추', '케일', '시금치', '청경채', '미나리', '깻잎', '쑥갓', '부추',
            '셀러리', '아스파라거스', '연근', '우엉', '비트', '순무', '래디시', '생강', '강황', '고수',
            '바질', '로즈마리', '타임', '오레가노', '민트', '파슬리', '딜', '세이지', '라벤더', '캐모마일',
            '해바라기', '코스모스', '백일홍', '메리골드', '페튜니아', '팬지', '나팔꽃', '봉선화', '맨드라미', '채송화'
        ];

        const seeds = seedNames.map((name, index) => ({
            id: index + 1,
            name: name,
            taste: parseFloat(generateNormalRandom(5, 2).toFixed(1)),
            nutrition: parseFloat(generateNormalRandom(5, 2).toFixed(1)),
            difficulty: parseFloat(generateNormalRandom(5, 2).toFixed(1)),
            preference: parseFloat(generateNormalRandom(5, 2).toFixed(1))
        }));

        // 슬라이더 값 실시간 업데이트
        const sliders = ['taste', 'nutrition', 'difficulty', 'preference'];
        sliders.forEach(slider => {
            const input = document.getElementById(slider);
            const display = document.getElementById(`${slider}-value`);
            input.addEventListener('input', function() {
                display.textContent = parseFloat(this.value).toFixed(1);
            });
        });

        // 벡터의 L2 norm (크기) 계산
        function calculateNorm(vector) {
            return Math.sqrt(vector.reduce((sum, val) => sum + val * val, 0));
        }

        // 코사인 유사도 계산
        function cosineSimilarity(vec1, vec2) {
            const dotProduct = vec1.reduce((sum, val, i) => sum + val * vec2[i], 0);
            const norm1 = calculateNorm(vec1);
            const norm2 = calculateNorm(vec2);
            
            if (norm1 === 0 || norm2 === 0) return 0;
            return dotProduct / (norm1 * norm2);
        }

        // 가중 코사인 유사도 계산
        // 최종 점수 = 코사인 유사도 × (사용자 벡터 크기 / 최대 벡터 크기)
        function weightedCosineSimilarity(userVector, seedVector) {
            const cosine = cosineSimilarity(userVector, seedVector);
            const userNorm = calculateNorm(userVector);
            const maxNorm = Math.sqrt(4 * 10 * 10); // 최대 벡터 크기 (모든 값이 10일 때)
            const weightFactor = userNorm / maxNorm;
            
            return cosine * weightFactor;
        }

        // 추천 시스템 메인 함수
        function getRecommendations() {
            // 사용자 입력값 가져오기
            const userVector = [
                parseFloat(document.getElementById('taste').value),
                parseFloat(document.getElementById('nutrition').value),
                parseFloat(document.getElementById('difficulty').value),
                parseFloat(document.getElementById('preference').value)
            ];

            // 모든 씨앗에 대해 유사도 계산
            const recommendations = seeds.map(seed => {
                const seedVector = [seed.taste, seed.nutrition, seed.difficulty, seed.preference];
                const score = weightedCosineSimilarity(userVector, seedVector);
                
                return {
                    ...seed,
                    score: score
                };
            });

            // 유사도 점수 기준 내림차순 정렬
            recommendations.sort((a, b) => b.score - a.score);

            // 상위 5개 추천
            const topRecommendations = recommendations.slice(0, 5);

            // 결과 출력
            displayResults(topRecommendations);
        }

        // 추천 결과 화면에 표시
        function displayResults(recommendations) {
            const resultsDiv = document.getElementById('results');
            const recommendationsDiv = document.getElementById('recommendations');
            
            recommendationsDiv.innerHTML = recommendations.map((seed, index) => `
                <div class="seed-card">
                    <div>
                        <span class="seed-rank">${index + 1}</span>
                        <span class="seed-name">${seed.name}</span>
                    </div>
                    <div class="seed-score">유사도 점수: ${(seed.score * 100).toFixed(2)}%</div>
                    <div class="seed-details">
                        <div class="seed-detail">🍎 맛: ${seed.taste}</div>
                        <div class="seed-detail">💪 영양가: ${seed.nutrition}</div>
                        <div class="seed-detail">🌾 난이도: ${seed.difficulty}</div>
                        <div class="seed-detail">❤️ 선호도: ${seed.preference}</div>
                    </div>
                </div>
            `).join('');
            
            resultsDiv.classList.add('show');
            resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
