<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채소 종자 추천 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .input-section {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: all 0.3s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #764ba2;
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }

        .value-display {
            min-width: 50px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2em;
            color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            margin-top: 40px;
        }

        .results h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
            text-align: center;
        }

        .seed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .seed-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s;
            cursor: pointer;
        }

        .seed-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-color: #667eea;
        }

        .seed-rank {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .seed-name {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .seed-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .stat-label {
            font-size: 0.85em;
            color: #666;
            font-weight: 600;
        }

        .stat-bar {
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s;
        }

        .similarity-score {
            text-align: center;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
        }

        .similarity-score strong {
            color: #667eea;
            font-size: 1.2em;
        }

        .no-results {
            text-align: center;
            color: #666;
            font-size: 1.2em;
            padding: 40px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .seed-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 채소 종자 추천 시스템</h1>
        <p class="subtitle">코사인 유사도 기반 맞춤형 종자 추천</p>

        <div class="input-section">
            <div class="input-group">
                <label>맛 (Taste)</label>
                <div class="slider-container">
                    <input type="range" id="taste" min="0" max="10" value="5">
                    <span class="value-display" id="taste-value">5</span>
                </div>
            </div>

            <div class="input-group">
                <label>인기 (Popularity)</label>
                <div class="slider-container">
                    <input type="range" id="popularity" min="0" max="10" value="5">
                    <span class="value-display" id="popularity-value">5</span>
                </div>
            </div>

            <div class="input-group">
                <label>건강 (Health)</label>
                <div class="slider-container">
                    <input type="range" id="health" min="0" max="10" value="5">
                    <span class="value-display" id="health-value">5</span>
                </div>
            </div>

            <div class="input-group">
                <label>재배 난이도 (Easy to Grow)</label>
                <div class="slider-container">
                    <input type="range" id="difficulty" min="0" max="10" value="5">
                    <span class="value-display" id="difficulty-value">5</span>
                </div>
            </div>

            <button onclick="getRecommendations()">추천받기</button>
        </div>

        <div class="results" id="results"></div>
    </div>

    <script>
        // 60개 채소 종자 데이터 (맛, 인기, 건강, 재배난이도)
        const seeds = [
            {name: "방울토마토", taste: 9, popularity: 10, health: 8, difficulty: 7},
            {name: "상추", taste: 6, popularity: 9, health: 7, difficulty: 9},
            {name: "시금치", taste: 5, popularity: 7, health: 9, difficulty: 8},
            {name: "고추", taste: 8, popularity: 9, health: 7, difficulty: 6},
            {name: "오이", taste: 7, popularity: 9, health: 6, difficulty: 7},
            {name: "가지", taste: 6, popularity: 7, health: 7, difficulty: 6},
            {name: "호박", taste: 7, popularity: 8, health: 7, difficulty: 8},
            {name: "파", taste: 7, popularity: 10, health: 6, difficulty: 9},
            {name: "배추", taste: 6, popularity: 9, health: 8, difficulty: 5},
            {name: "무", taste: 6, popularity: 8, health: 8, difficulty: 7},
            {name: "당근", taste: 7, popularity: 8, health: 9, difficulty: 6},
            {name: "감자", taste: 8, popularity: 10, health: 6, difficulty: 8},
            {name: "고구마", taste: 9, popularity: 9, health: 8, difficulty: 7},
            {name: "양파", taste: 7, popularity: 10, health: 7, difficulty: 6},
            {name: "마늘", taste: 8, popularity: 9, health: 9, difficulty: 7},
            {name: "생강", taste: 7, popularity: 7, health: 9, difficulty: 5},
            {name: "브로콜리", taste: 6, popularity: 7, health: 10, difficulty: 5},
            {name: "콜리플라워", taste: 5, popularity: 6, health: 9, difficulty: 5},
            {name: "양배추", taste: 6, popularity: 8, health: 8, difficulty: 7},
            {name: "케일", taste: 4, popularity: 6, health: 10, difficulty: 8},
            {name: "청경채", taste: 6, popularity: 7, health: 8, difficulty: 8},
            {name: "아스파라거스", taste: 7, popularity: 6, health: 8, difficulty: 4},
            {name: "셀러리", taste: 5, popularity: 5, health: 7, difficulty: 6},
            {name: "파프리카", taste: 8, popularity: 8, health: 8, difficulty: 6},
            {name: "피망", taste: 6, popularity: 8, health: 7, difficulty: 7},
            {name: "애호박", taste: 7, popularity: 8, health: 6, difficulty: 8},
            {name: "단호박", taste: 8, popularity: 7, health: 8, difficulty: 7},
            {name: "옥수수", taste: 9, popularity: 9, health: 6, difficulty: 7},
            {name: "완두콩", taste: 7, popularity: 6, health: 7, difficulty: 7},
            {name: "강낭콩", taste: 7, popularity: 7, health: 8, difficulty: 7},
            {name: "땅콩", taste: 8, popularity: 8, health: 7, difficulty: 6},
            {name: "들깨", taste: 7, popularity: 8, health: 8, difficulty: 8},
            {name: "깻잎", taste: 8, popularity: 9, health: 7, difficulty: 8},
            {name: "부추", taste: 7, popularity: 8, health: 7, difficulty: 9},
            {name: "쪽파", taste: 7, popularity: 8, health: 6, difficulty: 9},
            {name: "미나리", taste: 6, popularity: 6, health: 8, difficulty: 7},
            {name: "쑥갓", taste: 5, popularity: 6, health: 8, difficulty: 8},
            {name: "근대", taste: 5, popularity: 5, health: 8, difficulty: 8},
            {name: "치커리", taste: 4, popularity: 5, health: 7, difficulty: 7},
            {name: "루콜라", taste: 6, popularity: 6, health: 8, difficulty: 8},
            {name: "비트", taste: 6, popularity: 6, health: 9, difficulty: 6},
            {name: "순무", taste: 5, popularity: 5, health: 7, difficulty: 7},
            {name: "래디쉬", taste: 6, popularity: 7, health: 7, difficulty: 9},
            {name: "적채", taste: 5, popularity: 6, health: 8, difficulty: 7},
            {name: "청경채", taste: 6, popularity: 7, health: 8, difficulty: 8},
            {name: "갓", taste: 6, popularity: 6, health: 7, difficulty: 8},
            {name: "겨자채", taste: 5, popularity: 5, health: 7, difficulty: 8},
            {name: "바질", taste: 8, popularity: 7, health: 7, difficulty: 7},
            {name: "민트", taste: 7, popularity: 6, health: 7, difficulty: 9},
            {name: "로즈마리", taste: 7, popularity: 6, health: 8, difficulty: 6},
            {name: "타임", taste: 6, popularity: 5, health: 7, difficulty: 7},
            {name: "오레가노", taste: 7, popularity: 5, health: 7, difficulty: 8},
            {name: "파슬리", taste: 5, popularity: 6, health: 8, difficulty: 8},
            {name: "고수", taste: 6, popularity: 6, health: 7, difficulty: 7},
            {name: "딜", taste: 6, popularity: 5, health: 7, difficulty: 8},
            {name: "차이브", taste: 6, popularity: 5, health: 6, difficulty: 9},
            {name: "청양고추", taste: 9, popularity: 9, health: 7, difficulty: 6},
            {name: "꽈리고추", taste: 8, popularity: 8, health: 7, difficulty: 7},
            {name: "취나물", taste: 6, popularity: 6, health: 8, difficulty: 7},
            {name: "돌나물", taste: 5, popularity: 5, health: 8, difficulty: 9}
        ];

        // 슬라이더 값 업데이트
        const sliders = ['taste', 'popularity', 'health', 'difficulty'];
        sliders.forEach(id => {
            const slider = document.getElementById(id);
            const display = document.getElementById(`${id}-value`);
            slider.addEventListener('input', (e) => {
                display.textContent = e.target.value;
            });
        });

        // 코사인 유사도 계산
        function cosineSimilarity(vec1, vec2) {
            const dotProduct = vec1.reduce((sum, val, i) => sum + val * vec2[i], 0);
            const mag1 = Math.sqrt(vec1.reduce((sum, val) => sum + val * val, 0));
            const mag2 = Math.sqrt(vec2.reduce((sum, val) => sum + val * val, 0));
            return dotProduct / (mag1 * mag2);
        }

        // 추천 계산
        function getRecommendations() {
            const userPrefs = [
                parseInt(document.getElementById('taste').value),
                parseInt(document.getElementById('popularity').value),
                parseInt(document.getElementById('health').value),
                parseInt(document.getElementById('difficulty').value)
            ];

            // 각 씨앗의 유사도 계산
            const recommendations = seeds.map(seed => {
                const seedVector = [seed.taste, seed.popularity, seed.health, seed.difficulty];
                const similarity = cosineSimilarity(userPrefs, seedVector);
                return {
                    ...seed,
                    similarity: similarity
                };
            });

            // 유사도 순으로 정렬
            recommendations.sort((a, b) => b.similarity - a.similarity);

            // 상위 10개 표시
            displayResults(recommendations.slice(0, 10));
        }

        // 결과 표시
        function displayResults(recommendations) {
            const resultsDiv = document.getElementById('results');
            
            let html = '<h2>🏆 추천 결과 TOP 10</h2><div class="seed-grid">';
            
            recommendations.forEach((seed, index) => {
                html += `
                    <div class="seed-card">
                        <span class="seed-rank">${index + 1}위</span>
                        <div class="seed-name">${seed.name}</div>
                        <div class="seed-stats">
                            <div class="stat">
                                <span class="stat-label">맛</span>
                                <div class="stat-bar">
                                    <div class="stat-fill" style="width: ${seed.taste * 10}%"></div>
                                </div>
                            </div>
                            <div class="stat">
                                <span class="stat-label">인기</span>
                                <div class="stat-bar">
                                    <div class="stat-fill" style="width: ${seed.popularity * 10}%"></div>
                                </div>
                            </div>
                            <div class="stat">
                                <span class="stat-label">건강</span>
                                <div class="stat-bar">
                                    <div class="stat-fill" style="width: ${seed.health * 10}%"></div>
                                </div>
                            </div>
                            <div class="stat">
                                <span class="stat-label">재배난이도</span>
                                <div class="stat-bar">
                                    <div class="stat-fill" style="width: ${seed.difficulty * 10}%"></div>
                                </div>
                            </div>
                        </div>
                        <div class="similarity-score">
                            유사도: <strong>${(seed.similarity * 100).toFixed(1)}%</strong>
                        </div>
                    </div>
                `;
            });
            
            html += '</div>';
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
